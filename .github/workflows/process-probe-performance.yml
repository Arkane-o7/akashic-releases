name: Windows process probe performance
on:
  push:
    branches: [codex/public-installer-validation]
    paths: [.github/workflows/process-probe-performance.yml, validation/process-probe-performance.cjs]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - run: npm install --no-save --package-lock=false electron@43.7.5
      - run: npx electron validation/process-probe-performance.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-process-probe
          retention-days: 3
          path: output/probe
