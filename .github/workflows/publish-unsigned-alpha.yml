name: Publish validated unsigned alpha.6
on:
  push:
    branches: [codex/public-installer-validation]
    paths: [.github/workflows/publish-unsigned-alpha.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Require successful exact native build and journey runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 41661798829 -R Arkane-o7/akashic-releases --exit-status --interval 30
          test "$(gh run view 41657385616 -R Arkane-o7/akashic-releases --json conclusion --jq .conclusion)" = success
          test "$(gh run view 41661798829 -R Arkane-o7/akashic-releases --json conclusion --jq .conclusion)" = success
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 41657385616
          pattern: unsigned-alpha-*
          path: artifacts
      - name: Fetch exact private publishing implementation
        env:
          SOURCE_URL: ${{ secrets.NATIVE_SOURCE_URL }}
          SOURCE_KEY: ${{ secrets.NATIVE_SOURCE_KEY }}
        run: |
          curl --fail --silent --show-error --retry 3 -H "Authorization: Bearer $SOURCE_KEY" "$SOURCE_URL" -o "$RUNNER_TEMP/source.tar.gz"
          echo 'a08548bf204b82d7434d4aa5f79320ade8058f2a9ee504d4248ca2bdd428f657  '"$RUNNER_TEMP/source.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP"
          test "$(git -C "$RUNNER_TEMP/source" rev-parse HEAD)" = fa3a3640682c1f5dfac3c1d38a94d4cabb8c7eca
      - name: Publish complete unsigned alpha releases through the product publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir alpha6
          cp artifacts/unsigned-alpha-0.1.0-alpha.6-*/* alpha6/
          node --input-type=module <<'JS'
          import { pathToFileURL } from 'node:url';
          import path from 'node:path';
          const { publishRelease } = await import(pathToFileURL(path.join(process.env.RUNNER_TEMP, 'source/scripts/akashic/release/publish.mjs')));
          for (const [number, sourceCommit] of [[6,'fa3a3640682c1f5dfac3c1d38a94d4cabb8c7eca']]) {
            publishRelease({root:path.resolve(`alpha${number}`),version:`0.1.0-alpha.${number}`,tag:`v0.1.0-alpha.${number}`,repository:'Arkane-o7/akashic-releases',platforms:'windows-linux',sourceCommit,unsignedAlpha:true});
          }
          JS
      - name: Remove private source
        if: always()
        run: rm -rf "$RUNNER_TEMP/source" "$RUNNER_TEMP/source.tar.gz"
