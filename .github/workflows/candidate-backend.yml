name: Windows candidate startup diagnostic
on:
  push:
    branches: [codex/public-installer-validation]
    paths: [.github/workflows/candidate-backend.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - run: npm install --no-save --package-lock=false @playwright/test@1.62.1
      - run: npx playwright install ffmpeg
      - name: Download existing candidate through temporary encrypted link
        shell: pwsh
        env:
          CANDIDATE_URL: ${{ secrets.UPGRADE_WINDOWS_ASSET_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:CANDIDATE_URL) { throw 'Candidate download secret is missing' }
          try { Invoke-WebRequest -Uri $env:CANDIDATE_URL -OutFile candidate.zip } catch { throw 'Candidate download failed; renew the temporary artifact link' }
          $expected = 'fca1f5e129eb32dfa831833174abae9c76fc8ab8be8245807359005bda413992'
          if ((Get-FileHash candidate.zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Candidate ZIP digest mismatch' }
          Expand-Archive candidate.zip -DestinationPath candidate
      - name: Install candidate baseline
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'Installed Akashic'
          $start = New-Object System.Diagnostics.ProcessStartInfo
          $start.FileName = (Get-ChildItem candidate/0.1.0-alpha.9001/*.exe).FullName
          $start.Arguments = "/S /currentuser /D=$destination"
          $start.UseShellExecute = $false
          $installer = [System.Diagnostics.Process]::Start($start)
          if (!$installer.WaitForExit(180000)) { throw 'Installer timed out' }
          if ($installer.ExitCode -ne 0) { throw 'Installer failed' }
          "TEST_EXECUTABLE=$destination/Akashic Alpha.exe" >> $env:GITHUB_ENV
      - name: Check candidate onboarding and restart
        env:
          TEST_UPDATE_ENABLED: '1'
        run: node validation/installed-app.mjs
      - name: Capture Windows desktop and processes
        if: always()
        shell: pwsh
        run: ./validation/capture-windows.ps1 -OutputDirectory evidence
      - name: Save diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-candidate-startup
          retention-days: 3
          path: evidence
