name: Build merged main unsigned installers
on:
  push:
    branches: [codex/public-installer-validation]
    paths: [.github/workflows/unsigned-alpha-build.yml]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            version: 0.1.0-alpha.7
            revision: 8cd2c040fd3ac3e60e9f3ce907195426dc151353
          - os: ubuntu-22.04
            platform: linux
            version: 0.1.0-alpha.7
            revision: 8cd2c040fd3ac3e60e9f3ce907195426dc151353
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.0'
      - name: Fetch exact private build input without publishing source
        shell: pwsh
        env:
          SOURCE_URL: ${{ secrets.MERGED_MAIN_SOURCE_URL }}
          SOURCE_KEY: ${{ secrets.MERGED_MAIN_SOURCE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $archive = Join-Path $env:RUNNER_TEMP 'source.tar.gz'
          try { Invoke-WebRequest -Uri $env:SOURCE_URL -Headers @{Authorization="Bearer $env:SOURCE_KEY"} -OutFile $archive } catch { throw 'Authenticated build input download failed' }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne 'fcb06f9a986b4bbb79d1869e4ddd6393697f27f8f6607e42c35d4caa0f83fa13') { throw 'Source archive digest mismatch' }
          tar -xzf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Source extraction failed' }
          Set-Location (Join-Path $env:RUNNER_TEMP 'source')
          git config core.filemode false
          git config core.autocrlf false
          git checkout --detach '${{ matrix.revision }}'
          if ((git rev-parse HEAD) -ne '${{ matrix.revision }}') { throw 'Source revision mismatch' }
          if (git status --porcelain) { throw 'Extracted source differs from the committed tree' }
          Remove-Item $archive
      - name: Install workspace dependencies
        working-directory: ${{ runner.temp }}/source
        run: npm ci --no-audit --no-fund
      - name: Provision Electron
        working-directory: ${{ runner.temp }}/source
        run: node scripts/akashic/provision-electron.mjs
      - name: Linux package tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y rpm libarchive-tools libfuse2
      - name: Stage committed native runtime
        working-directory: ${{ runner.temp }}/source
        run: node scripts/akashic/stage-runtime.mjs
      - name: Verify relocated runtime
        working-directory: ${{ runner.temp }}/source
        run: node scripts/akashic/check-portable-runtime.mjs
      - name: Typecheck
        working-directory: ${{ runner.temp }}/source
        run: npm run typecheck --workspace apps/desktop
      - name: Verify release policy
        working-directory: ${{ runner.temp }}/source
        run: node --test scripts/akashic/release/publish.test.mjs
      - name: Startup runtime regression checks
        working-directory: ${{ runner.temp }}/source
        run: node --test apps/desktop/runtime/startup-timing.test.cjs apps/desktop/runtime/inventory.test.cjs apps/desktop/runtime/verification.test.cjs
      - name: Startup UI regression checks
        working-directory: ${{ runner.temp }}/source
        run: npm run test:ui --workspace apps/desktop -- src/lib/startup-timing.test.ts src/components/startup-splash.test.tsx src/components/onboarding/panel-motion.test.ts src/themes/unification.test.tsx src/components/onboarding/panel-journey.test.tsx src/components/gateway-connecting-overlay.test.tsx src/lib/startup-sound.test.ts src/components/analytics-consent.test.tsx src/store/product-analytics.test.ts src/store/analytics-presence-lifecycle.test.ts
      - name: Build desktop
        working-directory: ${{ runner.temp }}/source
        run: npm run build --workspace apps/desktop
      - name: Build unsigned rehearsal installers without update feed or publication
        id: package
        working-directory: ${{ runner.temp }}/source
        run: npm run builder --workspace apps/desktop -- --config ../../scripts/akashic/release/rehearsal.cjs --${{ matrix.platform }} --x64 --publish never -c.artifactName='Akashic-Alpha-UNSIGNED-${version}-${os}-${arch}.${ext}' ${{ matrix.platform == 'linux' && '-c.productName=Akashic' || '' }}
        env:
          AKASHIC_RELEASE_REPOSITORY: Arkane-o7/akashic-releases
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Record artifact checksums and build identity
        shell: pwsh
        working-directory: ${{ runner.temp }}/source
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem apps/desktop/release -File | Where-Object { $_.Name -match '\.(exe|AppImage|deb|rpm|blockmap)$' } | ForEach-Object { @{ name = $_.Name; size = $_.Length; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() } })
          if (-not $files.Count) { throw 'No installer artifacts were produced' }
          $runtime = Get-Content apps/desktop/build/akashic-runtime/manifest.json -Raw | ConvertFrom-Json -AsHashtable
          @{ sourceCommit = '${{ matrix.revision }}'; version = '${{ matrix.version }}'; platform = '${{ matrix.platform }}'; arch = 'x64'; rehearsal = $true; updateFeed = $false; published = $false; runtimeId = $runtime.runtimeId; runtimeSourceCommit = $runtime.sourceCommit; files = $files } | ConvertTo-Json -Depth 6 | Set-Content apps/desktop/release/build-receipt.json
          $files | ForEach-Object { "$($_.sha256)  $($_.name)" } | Set-Content apps/desktop/release/SHA256SUMS
      - name: Save only rehearsal installers and build receipt
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-main-${{ matrix.version }}-8cd2c040f-${{ matrix.platform }}
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/source/apps/desktop/release/*.exe
            ${{ runner.temp }}/source/apps/desktop/release/*.AppImage
            ${{ runner.temp }}/source/apps/desktop/release/*.deb
            ${{ runner.temp }}/source/apps/desktop/release/*.rpm
            ${{ runner.temp }}/source/apps/desktop/release/*.blockmap
            ${{ runner.temp }}/source/apps/desktop/release/SHA256SUMS
            ${{ runner.temp }}/source/apps/desktop/release/build-receipt.json
      - name: Remove private build input from runner
        if: always()
        shell: pwsh
        run: |
          Remove-Item (Join-Path $env:RUNNER_TEMP 'source') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:RUNNER_TEMP 'source.tar.gz') -Force -ErrorAction SilentlyContinue
